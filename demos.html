<!DOCTYPE html>
<html>
<head>
    <style>
        .video-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
        }

        .video-grid iframe {
            width: 100%;
            aspect-ratio: 16 / 9;
            border: none;
        }

        /* Tablet */
        @media (max-width: 1024px) {
            .video-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        /* Mobile */
        @media (max-width: 600px) {
            .video-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

<div class="video-grid">
    <iframe src="https://www.youtube.com/embed/w8Ifp5oJMYc" width="640" height="360" title="MindScape Research Presentation - Spring 2026" frameborder="0" allow="autoplay; clipboard-write; encrypted-media; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
